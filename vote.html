<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=11.2">
<title>格付けチェック 投票</title>
</head>
<body>
<main class="wrap">
  <h1 id="title">格付けチェック</h1>
  <div id="app" class="card">読込中...</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="app.js?v=11.2"></script>
<script>
if (typeof APP_VERSION === "undefined" || APP_VERSION < 11) alert("app.js が古いバージョンです。最新の app.js をアップロードして Ctrl+F5 で再読み込みしてください。");
const app = document.querySelector("#app");
const teamKeyParam = (new URLSearchParams(location.search).get("key") || "").trim();
let G = defaults, busy = false, localVote = "", rendered = false, stage = "匿名認証";

function render(g) {
  G = g;
  rendered = true;
  document.querySelector("#title").textContent = g.title;
  const me = findTeam(teamParam);
  if (!me || !teamKeyParam) {
    app.innerHTML = "<b>投票URLが無効です。</b><p>配られたQRコードから開き直してください。</p>";
    return;
  }
  const ph = phaseOf(g);
  const mine = sessionStorage.getItem("kk_"+g.current+"_"+me.id) || "";
  const conf = !!g.confirmed?.[me.id];
  const r = SETUP.ranks[g.rankIndexes?.[me.id] ?? 0] || SETUP.ranks[0];
  let h = '<div class="row" style="justify-content:space-between"><h2 style="margin:0">' + esc(me.name) + '</h2>' + rankBadge(r) + '</div>';

  if (ph === "lobby") {
    h += '<p class="big">まもなく開始します</p>';
  } else if (ph === "final") {
    // 最終結果発表で初めて回答時間の合計を表示
    h += '<p class="muted center">最終格付け</p><div class="center">' + rankBadge(r, "huge") + '</div>' +
      '<p class="center muted">スクリーンの結果発表をご覧ください</p>';
  } else {
    h += '<p class="muted">第' + g.current + '問' + (g.total ? ' / 全' + g.total + '問' : '') + '</p><h2>' + esc(g.question) + '</h2>';
    if (ph === "open") {
      h += '<div class="choices">' + g.choices.map(x =>
        '<button type="button" class="choice' + (mine === x ? ' selected' : '') + '" data-v="' + esc(x) + '"' + (conf ? ' disabled' : '') + '>' + esc(x) + '</button>').join("") + '</div>';
      if (conf) {
        h += '<div class="done">✔ ' + esc(mine) + ' で確定しました</div>';
      } else {
        h += '<button type="button" class="confirm" id="confirm"' + (mine ? '' : ' disabled') + '>' + (mine ? esc(mine) + ' で確定する' : '選んでから確定') + '</button>' +
          '<p class="muted center">確定するまで選び直せます。確定までの速さも順位に影響します</p>';
      }
      h += '<div class="vote-timer-slot"><div class="vote-timer" id="tm" aria-live="off"></div></div>';
    } else if (ph === "closed") {
      h += '<p class="big">締切</p><p class="center">あなたの回答：<b class="gold">' + (mine ? esc(mine) : "未投票") + '</b>' +
        (mine && !conf ? '（未確定）' : '') + '</p>';
    } else if (ph === "answer") {
      const d = mine === g.answer ? 0 : 1;
      h += '<div class="big gold">正解 ' + esc(g.answer) + '</div><p class="big">' +
        (mine === g.answer ? "⭕ 正解！" : mine ? "❌ 不正解" : "⏰ 未投票") + '</p>' +
        '<p class="center">' + (d > 0 ? d + 'ランクダウン → ' : 'ランク維持 ') + rankBadge(r) + '</p>';
    } else {
      h += '<p class="big">回答開始までお待ちください</p>';
    }
  }
  app.innerHTML = h;

  // 選択（確定前なら何度でも変更可）
  app.querySelectorAll(".choice").forEach(b => b.addEventListener("click", () => {
    if (phaseOf(G) !== "open" || !!G.confirmed?.[me.id]) return;
    const before = sessionStorage.getItem("kk_"+G.current+"_"+me.id) || "";
    localVote = b.dataset.v;
    sessionStorage.setItem("kk_"+G.current+"_"+me.id, localVote);
    render(G); // private vote変更はpublicGameを更新しないため、手元の選択UIは即座に再描画する
    db.ref("game/votes/" + G.current + "/" + me.id).set(localVote).catch(err => {
      console.error(err);
      localVote = before;
      if (before) sessionStorage.setItem("kk_"+G.current+"_"+me.id, before); else sessionStorage.removeItem("kk_"+G.current+"_"+me.id);
      render(G);
      alert("回答を保存できませんでした。投票URLまたは通信状態を確認してください。");
    });
  }));
  // 確定（ここで時刻を記録。確定後は変更不可）
  const cb = app.querySelector("#confirm");
  if (cb) cb.addEventListener("click", async () => {
    const v = sessionStorage.getItem("kk_"+G.current+"_"+me.id) || "";
    if (busy || !v || phaseOf(G) !== "open" || !!G.confirmed?.[me.id]) return;
    if (!confirm(v + " で確定しますか？\n確定すると変更できません。")) return;
    busy = true; cb.disabled = true;
    try {
      await db.ref("game/confirms/" + G.current + "/" + me.id).set({ c: v, at: TS });
    } catch (e) {
      alert("確定できませんでした。もう一度押してください。");
    } finally { busy = false; }
  });
}

function tick(g) {
  const el = document.querySelector("#tm");
  if (!el) return;
  const r = remainingSec(g);
  el.className = "vote-timer";
  if (r == null) { el.textContent = ""; return; }
  if (r <= 5) el.classList.add("danger5");
  else if (r <= 10) el.classList.add("warn10");
  el.textContent = "残り " + r + " 秒";
}
async function authorizeTeam(){
  if(!teamParam||!teamKeyParam) throw new Error("URLにteamまたはkeyがありません");
  stage = "匿名認証";
  let u=firebase.auth().currentUser; if(!u) u=(await firebase.auth().signInAnonymously()).user;
  stage = "チームキー確認";
  await db.ref("teamSessions/"+u.uid).set({team:teamParam,key:teamKeyParam});
  stage = "画面データ取得";
}
// 描画中のエラーは画面に出す（真っ白・読込中で止まらないように）
function safeRender(g){
  try { render(g); }
  catch(e){ console.error(e); app.innerHTML='<b>画面の表示でエラーが発生しました。</b><p class="muted">'+esc(e.message||e)+'</p><button type="button" class="confirm" onclick="location.reload()">再読み込み</button>'; }
}
function showError(title, e){
  console.error(e);
  const msg = String(e && (e.code || e.message) || e);
  app.innerHTML='<b>'+title+'</b><p class="muted">段階：'+esc(stage)+'<br>'+esc(msg)+'</p><button type="button" class="confirm" onclick="location.reload()">再読み込み</button>';
}
function watchPublic(){
  let g = null, lastPhase = null;
  const redraw = () => { if (!g) return; lastPhase = phaseOf(g); safeRender(g); tick(g); };
  Promise.all([db.ref("publicSetup").once("value"), db.ref("publicGame").once("value")]).then(([s, gs]) => {
    SETUP = normalizeSetup(s.val());
    g = { ...defaults, ...(gs.val() || {}) };
    redraw();
    stage = "リアルタイム受信";
    db.ref("publicSetup").on("value", s2 => { SETUP = normalizeSetup(s2.val()); redraw(); }, e => showError("設定の受信が止まりました。", e));
    db.ref("publicGame").on("value", g2 => { g = { ...defaults, ...(g2.val() || {}) }; redraw(); }, e => showError("進行状況の受信が止まりました。", e));
    setInterval(() => {
      if (!g) return;
      const p = phaseOf(g);
      if (p !== lastPhase) { lastPhase = p; safeRender(g); }
      tick(g);
    }, 250);
  }).catch(e => showError("画面データを取得できませんでした。", e));
}
// 10秒たっても表示できなければ、どこで止まったかを表示
setTimeout(()=>{ if(!rendered) showError("読み込みに時間がかかっています。", "通信状態を確認してください"); }, 10000);
authorizeTeam().then(()=>watchPublic()).catch(e=>{
  const denied = /permission/i.test(String(e && (e.code||e.message)||e));
  showError(denied ? "投票URLが無効です。配られたQRコードから開き直してください。" : "接続できませんでした。", e);
});
</script>
</body>
</html>
