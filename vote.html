<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=11.18">
<title>格付けチェック 投票</title>
</head>
<body>
<main class="wrap">
  <h1 id="title">格付けチェック</h1>
  <div id="app" class="card">読込中...</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="app.js?v=11.18"></script>
<script>
if (typeof APP_VERSION === "undefined" || APP_VERSION < 11) alert("app.js が古いバージョンです。最新の app.js をアップロードして Ctrl+F5 で再読み込みしてください。");
const app = document.querySelector("#app");
const teamKeyParam = (new URLSearchParams(location.search).get("key") || "").trim();
let G = defaults, busy = false, localVote = "", rendered = false, stage = "匿名認証";
const TXT={
 ja:{wait:"まもなく開始します",final:"最終格付け",see:"スクリーンの結果発表をご覧ください",closed:"締切",your:"あなたの回答：",none:"未投票",unconfirmed:"（未確定）",correct:"正解",ok:"⭕ 正解！",ng:"❌ 不正解",rankdown:"ランクダウン → ",keep:"ランク維持 ",ready:"回答開始までお待ちください",confirm:"で確定する",select:"選んでから確定",retry:"確定するまで選び直せます。確定までの速さも順位に影響します",done:"で確定しました",remain:"残り ",sec:" 秒"},
 en:{wait:"Please wait for the game to start",final:"Final Rank",see:"Please watch the final results on the main screen",closed:"Voting Closed",your:"Your answer: ",none:"No answer",unconfirmed:" (not confirmed)",correct:"Correct Answer",ok:"⭕ Correct!",ng:"❌ Incorrect",rankdown:" rank down → ",keep:"Rank maintained ",ready:"Please wait for voting to open",confirm:" - Confirm",select:"Select an answer",retry:"You can change your choice until you confirm. Confirmation speed affects ranking.",done:" confirmed",remain:"Time left ",sec:" sec"}
};


function render(g) {
  G=g; rendered=true; document.querySelector("#title").textContent=g.title;
  const me=findTeam(teamParam); if(!me||!teamKeyParam){app.innerHTML="<b>投票URLが無効です。</b><p>配られたQRコードから開き直してください。</p>";return;}
  const lang=me.language==="en"?"en":"ja",tx=TXT[lang]; document.documentElement.lang=lang;
  const ph=phaseOf(g), mine=sessionStorage.getItem("kk_"+(g.sessionId||"legacy")+"_"+g.current+"_"+me.id)||"", conf=!!g.confirmed?.[me.id], r=SETUP.ranks[g.rankIndexes?.[me.id]??0]||SETUP.ranks[0];
  let h='<div class="row" style="justify-content:space-between"><h2 style="margin:0">'+esc(me.name)+'</h2>'+rankBadge(r,"",lang)+'</div>';
  if(ph==="lobby") h+='<p class="big">'+tx.wait+'</p>';
  else if(ph==="rankboard"||ph==="final") h+='<p class="muted center">'+tx.final+'</p><div class="center">'+rankBadge(r,"huge",lang)+'</div><p class="center muted">'+tx.see+'</p>';
  else { h+='<p class="muted">'+(lang==="en"?'Question ':'第')+g.current+(lang==="en"?(g.total?' / '+g.total:''):'問'+(g.total?' / 全'+g.total+'問':''))+'</p><h2>'+esc(g.question)+'</h2>';
    if(ph==="open"){ h+='<div class="choices">'+g.choices.map(x=>'<button type="button" class="choice'+(mine===x?' selected':'')+'" data-v="'+esc(x)+'"'+(conf?' disabled':'')+'>'+esc(x)+'</button>').join('')+'</div>';
      if(conf) h+='<div class="done">✔ '+esc(mine)+tx.done+'</div>'; else h+='<button type="button" class="confirm" id="confirm"'+(mine?'':' disabled')+'>'+(mine?esc(mine)+tx.confirm:tx.select)+'</button><p class="muted center">'+tx.retry+'</p>';
      h+='<div class="vote-timer-slot"><div class="vote-timer" id="tm" aria-live="off"></div></div>';
    } else if(ph==="closed") h+='<p class="big">'+tx.closed+'</p><p class="center">'+tx.your+'<b class="gold">'+(mine?esc(mine):tx.none)+'</b>'+(mine&&!conf?tx.unconfirmed:'')+'</p>';
    else if(ph==="answer"){const d=mine===g.answer?0:1;h+='<div class="big gold">'+tx.correct+' '+esc(g.answer)+'</div><p class="big">'+(mine===g.answer?tx.ok:mine?tx.ng:'⏰ '+tx.none)+'</p><p class="center">'+(d>0?d+tx.rankdown:tx.keep)+rankBadge(r,"",lang)+'</p>';}
    else h+='<p class="big">'+tx.ready+'</p>';
  }
  app.innerHTML=h;
  app.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{if(phaseOf(G)!=="open"||!!G.confirmed?.[me.id])return;const k="kk_"+(G.sessionId||"legacy")+"_"+G.current+"_"+me.id,before=sessionStorage.getItem(k)||"";localVote=b.dataset.v;sessionStorage.setItem(k,localVote);render(G);db.ref("game/votes/"+G.current+"/"+me.id).set(localVote).catch(err=>{console.error(err);localVote=before;if(before)sessionStorage.setItem(k,before);else sessionStorage.removeItem(k);render(G);alert(lang==="en"?"Could not save your answer.":"回答を保存できませんでした。投票URLまたは通信状態を確認してください。");});}));
  const cb=app.querySelector("#confirm"); if(cb)cb.addEventListener("click",async()=>{const k="kk_"+(G.sessionId||"legacy")+"_"+G.current+"_"+me.id,v=sessionStorage.getItem(k)||"";if(busy||!v||phaseOf(G)!=="open"||!!G.confirmed?.[me.id])return;if(!confirm(lang==="en"?"Confirm "+v+"? You cannot change it afterward.":v+" で確定しますか？\n確定すると変更できません。"))return;busy=true;cb.disabled=true;try{await db.ref("game/confirms/"+G.current+"/"+me.id).set({c:v,at:TS});}catch(e){alert(lang==="en"?"Could not confirm. Please try again.":"確定できませんでした。もう一度押してください。");}finally{busy=false;}});
}
function tick(g){const el=document.querySelector("#tm");if(!el)return;const r=remainingSec(g),me=findTeam(teamParam),tx=TXT[me?.language==="en"?"en":"ja"];el.className="vote-timer";if(r==null){el.textContent="";return;}if(r<=5)el.classList.add("danger5");else if(r<=10)el.classList.add("warn10");el.textContent=tx.remain+r+tx.sec;}
async function authorizeTeam(){
  if(!teamParam||!teamKeyParam) throw new Error("URLにteamまたはkeyがありません");
  stage = "匿名認証";
  let u=firebase.auth().currentUser; if(!u) u=(await firebase.auth().signInAnonymously()).user;
  stage = "チームキー確認";
  await db.ref("teamSessions/"+u.uid).set({team:teamParam,key:teamKeyParam});
  stage = "画面データ取得";
}
// 描画中のエラーは画面に出す（真っ白・読込中で止まらないように）
function safeRender(g){
  try { render(g); }
  catch(e){ console.error(e); app.innerHTML='<b>画面の表示でエラーが発生しました。</b><p class="muted">'+esc(e.message||e)+'</p><button type="button" class="confirm" onclick="location.reload()">再読み込み</button>'; }
}
function showError(title, e){
  console.error(e);
  const msg = String(e && (e.code || e.message) || e);
  app.innerHTML='<b>'+title+'</b><p class="muted">段階：'+esc(stage)+'<br>'+esc(msg)+'</p><button type="button" class="confirm" onclick="location.reload()">再読み込み</button>';
}

// 10秒たっても表示できなければ、どこで止まったかを表示
setTimeout(()=>{ if(!rendered) showError("読み込みに時間がかかっています。", "通信状態を確認してください"); }, 10000);
authorizeTeam().then(()=>watchAll(safeRender, tick, (w,e)=>showError("画面データを取得できませんでした。", w+" / "+(e.code||e.message||e)))).catch(e=>{
  const denied = /permission/i.test(String(e && (e.code||e.message)||e));
  showError(denied ? "投票URLが無効です。配られたQRコードから開き直してください。" : "接続できませんでした。", e);
});
</script>
</body>
</html>
