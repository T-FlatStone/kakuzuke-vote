<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=9">
<title>司会</title>
</head>
<body>
<div id="loginView" class="auth-shell"><div class="auth-card"><h1>司会ログイン</h1><form id="loginForm"><label for="loginId">ID（メールアドレス）</label><input id="loginId" type="email" autocomplete="username" required><label for="loginPw">パスワード</label><input id="loginPw" type="password" autocomplete="current-password" required><button class="ctrl" type="submit">ログイン</button><div id="loginError" class="auth-error" aria-live="polite"></div></form></div></div>
<main class="wrap" id="protectedApp" style="max-width:640px;display:none"><div class="auth-user"><span id="authWho"></span><button type="button" class="ctrl sub" id="logoutBtn">ログアウト</button></div>
  <h1>司会 <small style="font-size:14px;color:#aaa">v9</small></h1>
  <div id="versionGuard" style="display:none;background:#8b1d1d;color:#fff;border:3px solid #ff6b6b;border-radius:14px;padding:16px;margin:12px 0;font-weight:900;font-size:20px">⚠ 古いシステムを検出しました。回答時間が計測されません。最新版を反映し、このページを再読み込みしてください。</div>
  <div class="card" id="info" aria-live="polite">読込中...</div>
  <div class="hostbtns">
    <button type="button" class="hostbtn" id="bStart" disabled>回答開始</button>
    <button type="button" class="hostbtn alt" id="bAnswer" disabled>正解発表</button>
    <button type="button" class="hostbtn next" id="bNext" disabled>次の問題へ</button>
  </div>
  <p class="muted center" id="hint"></p>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script src="app.js?v=9"></script>
<script>
if (typeof APP_VERSION === "undefined" || APP_VERSION < 9) {
  document.querySelector("#versionGuard").style.display = "block";
  alert("⚠ 古い app.js を検出しました。回答時間が計測されません。最新版を反映してページを再読み込みしてください。");
}
const ADMIN_UID = C.roles?.adminUid || "", HOST_UID = C.roles?.hostUid || "";
const auth = firebase.auth();
const loginView = document.querySelector("#loginView"), protectedApp = document.querySelector("#protectedApp"), loginError = document.querySelector("#loginError");
document.querySelector("#loginForm").addEventListener("submit", async e => { e.preventDefault(); loginError.textContent=""; try { await auth.signInWithEmailAndPassword(document.querySelector("#loginId").value.trim(), document.querySelector("#loginPw").value); } catch(err) { loginError.textContent="IDまたはパスワードが違います。"; } });
document.querySelector("#logoutBtn").addEventListener("click", () => auth.signOut());
auth.onAuthStateChanged(async user => {
  if (!user) { loginView.style.display="block"; protectedApp.style.display="none"; return; }
  if (user.uid !== HOST_UID && user.uid !== ADMIN_UID) { loginError.textContent="このアカウントには司会権限がありません。"; await auth.signOut(); return; }
  document.querySelector("#authWho").textContent = user.email || "Host"; loginView.style.display="none"; protectedApp.style.display="block";
});
const $ = s => document.querySelector(s);
let G = defaults;
function render(g) {
  G = g;
  const ph = phaseOf(g);
  const n = SETUP.questions.length;
  const q = SETUP.questions[g.current - 1];
  let h = '<div class="row" style="justify-content:space-between"><b class="gold">' + PHASE_LABEL[ph] + '</b>' +
    '<span>' + (g.current ? '第' + g.current + '問 / 全' + n + '問' : '全' + n + '問') + '</span></div>';
  if (g.current && ph !== "lobby" && ph !== "final") {
    h += '<h2>' + esc(g.question) + '</h2>' +
      '<div class="row" style="justify-content:space-between"><span>回答済み <b class="gold">' + countConfirmed(g) + '</b> / ' + SETUP.teams.length + '</span>' +
      '<span class="muted">正解（司会用）：' + esc(q?.answer || "未登録") + '　失敗時 ↓' + (q ? q.penalty : 1) + '</span></div><div class="timer" id="tm"></div>';
  }
  if (ph === "final") {
    h += '<p class="muted">スクリーンで4位から順に発表されます</p>' + standings(g).filter(x => x.place <= BEST_N)
      .map(x => '<div>' + x.place + '位　' + esc(x.team.name) + '　' + esc(SETUP.ranks[x.ri].name) + '　' + fmtSec(x.ms) + '</div>').join("");
  }
  $("#info").innerHTML = h;
  const manualClose = ph === "open" && !g.deadline;
  $("#bStart").textContent = manualClose ? "締め切る" : "回答開始";
  $("#bStart").disabled = !(ph === "ready" || manualClose);
  $("#bAnswer").disabled = ph !== "closed";
  const isLast = g.current >= n && n > 0;
  $("#bNext").textContent = g.current === 0 ? "第1問へ" : isLast ? "最終結果発表" : "次の問題へ";
  $("#bNext").disabled = n === 0 || !(ph === "lobby" || ph === "answer");
  $("#hint").textContent = n === 0 ? "問題が登録されていません。管理ページで登録してください。"
    : SETUP.timerSec > 0 ? "制限時間 " + SETUP.timerSec + " 秒（時間になると自動で締切）" : "制限時間なし（「締め切る」で手動締切）";
}
function tick(g) {
  autoClose(g);
  const el = $("#tm"); if (!el) return;
  const r = remainingSec(g); el.textContent = r == null ? "" : "残り " + r + " 秒";
}
$("#bStart").addEventListener("click", () => { if (phaseOf(G) === "open") Ops.close(G); else Ops.start(G); });
$("#bAnswer").addEventListener("click", () => { const ans = SETUP.questions[G.current - 1]?.answer; if (ans && !confirm("正解「" + ans + "」を発表しますか？")) return; Ops.reveal(G); });
$("#bNext").addEventListener("click", () => { if (G.current >= SETUP.questions.length) { if (confirm("最終結果を発表しますか？")) Ops.final(); } else Ops.goto(G.current + 1); });
watchAll(render, tick);
</script>
</body>
</html>
