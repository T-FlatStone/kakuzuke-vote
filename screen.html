<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=11">
<title>格付けチェック スクリーン</title>
</head>
<body class="screen-page">
<main class="wrap">
  <h1 id="title">格付けチェック</h1>
  <div id="head" class="card"></div>
  <div id="body"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="app.js?v=11"></script>
<script>
if (typeof APP_VERSION === "undefined" || APP_VERSION < 11) alert("app.js が古いバージョンです。最新の app.js をアップロードして Ctrl+F5 で再読み込みしてください。");
let finalShown = false;   // 最終結果のアニメーションを1回だけ再生するため

function render(g) {
  const ph = phaseOf(g);
  document.querySelector("#title").textContent = g.title;
  const head = document.querySelector("#head");
  const body = document.querySelector("#body");

  if (ph !== "final") finalShown = false;

  // 開始前
  if (ph === "lobby") {
    head.innerHTML = '<div class="big gold">' + esc(g.title) + '</div><p class="big" style="font-size:32px">まもなく開始します</p>';
    body.innerHTML = "";
    return;
  }

  // 最終結果：ここで初めて順位と回答時間の合計を表示（4位→1位の順に登場）
  if (ph === "final") {
    if (finalShown) return;
    finalShown = true;
    const best = standings(g).filter(x => x.place <= BEST_N);
    const maxPlace = Math.max(...best.map(x => x.place), 1);
    head.innerHTML = '<div class="big gold">最終結果発表</div><p class="center muted">同じ格付けなら、回答時間の合計が短いチームが上位</p>';
    body.innerHTML = '<div class="best">' + best.map(x => {
        const delay = 1 + (maxPlace - x.place) * 2.5;   // 4位から順に2.5秒間隔
        return '<div class="place' + (x.place === 1 ? ' p1' : '') + '" style="animation-delay:' + delay + 's">' +
          '<span class="no">' + x.place + '位</span><span class="nm">' + esc(x.team.name) + '</span>' +
          rankBadge(SETUP.ranks[x.ri]) + '<span class="sec">合計 ' + fmtSec(x.ms) + '</span></div>';
      }).join("") + '</div>' +
      '<h2 class="gold">全チームの格付け</h2><div class="rankgrid">' + rankGroups(g).map(gr =>
        '<div class="rankbox" style="' + rankStyle(gr.rank) + '"><h3>' + esc(gr.rank.name) + '（' + gr.teams.length + '）</h3>' +
        gr.teams.map(t => '<span class="t">' + esc(t.name) + '</span>').join("") + '</div>').join("") + '</div>';
    return;
  }

  let statusHtml;
  if (ph === "open") statusHtml = '<div class="screen-statusline open-state"><div class="screen-center-open"><div class="screen-timer-slot"><div class="screen-timer" id="tm"></div></div></div><div class="screen-confirmed">' + countConfirmed(g) + ' / ' + SETUP.teams.length + ' チーム回答済み</div></div>';
  else if (ph === "closed") statusHtml = '<div class="screen-statusline closed-state"><div class="screen-status-main">締切！</div></div>';
  else if (ph === "answer") statusHtml = '<div class="screen-statusline answer-state"><div class="screen-status-main"><span class="gold">正解は ' + esc(g.answer) + '！</span></div></div>';
  else statusHtml = '<div class="screen-statusline pre"><div class="screen-status-main">まもなく回答開始</div></div>';
  head.innerHTML = '<div class="muted">第' + g.current + '問' + (g.total ? ' / 全' + g.total + '問' : '') + '</div><h2>' + esc(g.question) + '</h2>' + statusHtml;
  body.innerHTML = '<div class="teams">' + SETUP.teams.map(t => {
    const v = voteOf(g, g.current, t.id);
    const conf = confirmOf(g, g.current, t.id);
    const r = rankOf(g, t.id);
    let cls = "team", txt, style;
    if (ph === "answer") {
      const ok = v === g.answer, d = dropOf(g, t.id);
      cls += ok ? " ok" : " ng";
      txt = (v ? esc(v) + " " + (ok ? "⭕" : "❌") : "未投票 ❌") + (d > 0 ? ' <span class="drop">↓' + d + '</span>' : '');
      style = choiceStyle(v);
    } else if (ph === "closed") {
      txt = v ? "回答：" + esc(v) : "未投票";          // 締切の瞬間に回答を公開
      style = choiceStyle(v);                         // A赤 / B青 / C黄 / D緑 / 未投票グレー
    } else {
      txt = conf ? "✔ 回答済み" : "待機中";            // 確定するまでは「待機中」
      style = rankStyle(r);
    }
    return '<div class="' + cls + '" style="' + style + '"><b>' + esc(t.name) + '</b><div class="ans">' + txt + '</div>' + rankBadge(r) + '</div>';
  }).join("") + '</div>';
}

function tick(g) { const el=document.querySelector("#tm"); if(!el)return; const r=remainingSec(g); el.className="screen-timer"; if(r==null){el.textContent="";return;} if(r<=5)el.classList.add("danger5"); else if(r<=10)el.classList.add("warn10"); el.textContent=r+" 秒"; }
watchAll(render, tick);
</script>
</body>
</html>
