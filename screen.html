<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=11.17">
<title>格付けチェック スクリーン</title>
</head>
<body class="screen-page">
<main class="wrap">
  <h1 id="title">格付けチェック</h1>
  <div id="head" class="card"></div>
  <div id="imageStage" class="image-stage" hidden></div>
  <div id="body"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="config.js"></script>
<script src="app.js?v=11.17"></script>
<script>
if (typeof APP_VERSION === "undefined" || APP_VERSION < 11) alert("app.js が古いバージョンです。最新の app.js をアップロードして Ctrl+F5 で再読み込みしてください。");
let finalShown = false;
  let imageToken=0, latestRenderSeq=0, currentImagePath="", latestStateRev=0; const imageCache=new Map();
  async function cachedUrl(path){if(imageCache.has(path))return imageCache.get(path);const u=await storageUrl(path);imageCache.set(path,u);return u;}
  async function preloadStage(path){if(!path)return;try{const u=await cachedUrl(path),i=new Image();i.src=u;}catch(e){console.warn("preload",e);}}
  async function showStageImage(path){const token=++imageToken,stage=document.querySelector("#imageStage");currentImagePath=path||"";if(!path){stage.hidden=true;stage.replaceChildren();return false;}stage.hidden=false;stage.classList.add("loading");stage.replaceChildren();try{const url=await cachedUrl(path);if(token!==imageToken)return false;const img=new Image();img.alt="表示画像";await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url;});if(token!==imageToken||path!==currentImagePath)return false;stage.replaceChildren(img);stage.classList.remove("loading");return true;}catch(e){console.error(e);if(token===imageToken){stage.classList.remove("loading");stage.hidden=true;stage.replaceChildren();}return false;}}
  function hideStageImage(){imageToken++;currentImagePath="";const stage=document.querySelector("#imageStage");stage.hidden=true;stage.classList.remove("loading");stage.replaceChildren();}

function render(g) {
  const ph = phaseOf(g);
  document.querySelector("#title").textContent = g.title;
  const head = document.querySelector("#head");
  const body = document.querySelector("#body");

  if (ph !== "final") finalShown = false;
    if((ph==="lobby"||ph==="intro"||ph==="ready")&&g.imagePath){ head.style.display="none"; body.style.display="none"; showStageImage(g.imagePath).then(ok=>{if(!ok&&renderSeq===latestRenderSeq){const st=document.querySelector("#imageStage");st.hidden=false;st.classList.remove("loading");st.textContent="画像を表示できません / Image unavailable";}}); preloadStage(g.nextImagePath); return; }
    hideStageImage(); head.style.display="flex"; body.style.display="block";

  // 開始前
  if (ph === "lobby") {
    head.innerHTML = '<div class="big gold">' + esc(g.title) + '</div><p class="big" style="font-size:32px">まもなく開始します</p>';
    body.innerHTML = "";
    return;
  }

  // 全チーム格付け：通常チームカードのまま、見出しだけ変更
  const isRankboard = ph === "rankboard";
  // 最終結果は公開済みの集計結果だけを使用
  if (ph === "final") {
    if (finalShown) return; finalShown=true;
    db.ref("publicResults").once("value").then(snap=>{
      const rr=snap.val()||{}, best=toArr(rr.best), groups=toArr(rr.groups);
      head.innerHTML='<div class="big gold">最終結果発表</div><p class="center muted">同じ格付けなら、回答時間の合計が短いチームが上位</p>';
      body.innerHTML='<div class="best">'+best.map((x,i)=>'<div class="place'+(x.place===1?' p1':'')+'" style="animation-delay:'+(1+i*2.5)+'s"><span class="no">'+x.place+'位</span><span class="nm">'+esc(x.name)+'</span>'+rankBadge(x.rank)+'<span class="sec">合計 '+fmtSec(x.ms)+'</span></div>').join('')+'</div><h2 class="gold">全チームの格付け</h2><div class="rankgrid">'+groups.map(gr=>'<div class="rankbox" style="'+rankStyle(gr.rank)+'"><h3>'+esc(rankName(gr.rank,"ja"))+'<small>'+esc(rankName(gr.rank,"en"))+'</small>'+'（'+toArr(gr.names).length+'）</h3>'+toArr(gr.names).map(n=>'<span class="t">'+esc(n)+'</span>').join('')+'</div>').join('')+'</div>';
    }); return;
  }

  let statusHtml;
  if (isRankboard) statusHtml = '<div class="screen-statusline"><div class="big gold">全チーム格付け / All Team Ranks</div></div>';
  else if (ph === "open") statusHtml = '<div class="screen-statusline open-state"><div class="screen-center-open"><div class="screen-timer-slot"><div class="screen-timer" id="tm"></div></div></div><div class="screen-confirmed">' + Object.keys(g.confirmed || {}).length + ' / ' + SETUP.teams.length + ' チーム回答済み</div></div>';
  else if (ph === "closed") statusHtml = '<div class="screen-statusline closed-state"><div class="screen-status-main">締切！</div></div>';
  else if (ph === "answer") statusHtml = '<div class="screen-statusline answer-state"><div class="screen-status-main"><span class="gold">正解は ' + esc(g.answer) + '！</span></div></div>';
  else statusHtml = '<div class="screen-statusline pre"><div class="screen-status-main">まもなく回答開始</div></div>';
  head.innerHTML = '<div class="muted">第' + g.current + '問' + (g.total ? ' / 全' + g.total + '問' : '') + '</div><h2>' + esc(g.question) + '</h2>' + statusHtml;
  body.innerHTML = '<div class="teams">' + SETUP.teams.map(t => {
    const v = g.revealedVotes?.[t.id] || "";
    const conf = !!g.confirmed?.[t.id];
    const r = SETUP.ranks[g.rankIndexes?.[t.id] ?? 0] || SETUP.ranks[0];
    let cls = "team", txt, style;
    if (isRankboard) { txt = rankBadge(r); style = rankStyle(r); }
    else if (ph === "answer") {
      const ok = v === g.answer, d = dropOf(g, t.id);
      cls += ok ? " ok" : " ng";
      txt = (v ? esc(v) + " " + (ok ? "⭕" : "❌") : "未投票 ❌") + (d > 0 ? ' <span class="drop">↓' + d + '</span>' : '');
      style = choiceStyle(v);
    } else if (ph === "closed") {
      txt = v ? "回答：" + esc(v) : "未投票";          // 締切の瞬間に回答を公開
      style = choiceStyle(v);                         // A赤 / B青 / C黄 / D緑 / 未投票グレー
    } else {
      txt = conf ? "✔ 回答済み" : "待機中";            // 確定するまでは「待機中」
      style = rankStyle(r);
    }
    return '<div class="' + cls + '" style="' + style + '"><b>' + esc(t.name) + '</b><div class="ans">' + txt + '</div>' + (isRankboard ? '' : rankBadge(r)) + '</div>';
  }).join("") + '</div>';
}

function tick(g) { const el=document.querySelector("#tm"); if(!el)return; const r=remainingSec(g); el.className="screen-timer"; if(r==null){el.textContent="";return;} if(r<=5)el.classList.add("danger5"); else if(r<=10)el.classList.add("warn10"); el.textContent=r+" 秒"; }
watchAll(render, tick);
</script>
</body>
</html>
