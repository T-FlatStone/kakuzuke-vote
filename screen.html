<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=2">
<title>格付けチェック スクリーン</title>
</head>
<body>
<main class="wrap">
  <h1 id="title">格付けチェック</h1>
  <div id="head" class="card"></div>
  <div id="body"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="app.js?v=2"></script>
<script>
function render(g) {
  const ph = phaseOf(g);
  const vs = g.votes?.[g.current] || {};
  document.querySelector("#title").textContent = g.title;
  const head = document.querySelector("#head");
  const body = document.querySelector("#body");

  // 開始前
  if (ph === "lobby") {
    head.innerHTML = '<div class="big gold">' + esc(g.title) + '</div><p class="big" style="font-size:32px">まもなく開始します</p>';
    body.innerHTML = "";
    return;
  }

  // 最終結果：ランク別にチームを表示
  if (ph === "final") {
    head.innerHTML = '<div class="big gold">最終格付け発表</div>';
    body.innerHTML = '<div class="rankgrid">' + rankGroups(g).map(gr =>
      '<div class="rankbox"><h3>' + esc(gr.rank) + '（' + gr.teams.length + '）</h3>' +
      gr.teams.map(t => '<span class="t">' + t + '</span>').join("") + '</div>').join("") + '</div>';
    return;
  }

  // 問題表示〜正解発表
  let status;
  if (ph === "answer") status = '<div class="big gold">正解は ' + esc(g.answer) + '！</div>';
  else if (ph === "closed") status = '<div class="big">締切！</div>';
  else if (ph === "open") status = '<div class="big">' + Object.keys(vs).length + ' / ' + C.teams.length + ' チーム回答</div><div class="timer huge" id="tm"></div>';
  else status = '<div class="big" style="font-size:32px">まもなく回答開始</div>';

  head.innerHTML = '<div class="muted">第' + g.current + '問' + (g.total ? ' / 全' + g.total + '問' : '') + '</div>' +
    '<h2>' + esc(g.question) + '</h2>' + status;

  body.innerHTML = '<div class="teams">' + C.teams.map(t => {
    const v = vs[t];
    let cls = "team";
    if (ph === "answer" && v) cls += v === g.answer ? " ok" : " ng";

    const txt = ph === "answer"
      ? (v ? esc(v) + " " + (v === g.answer ? "⭕" : "❌") : "未投票")
      : ph === "closed"
        ? (v ? "回答：" + esc(v) : "未投票")      // 締切の瞬間に回答を公開
        : (v ? "回答済み" : "待機中");            // 受付中は中身を隠す

    return '<div class="' + cls + '"><b>' + t + '</b><br>' + txt +
      '<br><small>' + esc(C.ranks[calcRank(g.votes, g.answers, t)]) + '</small></div>';
  }).join("") + '</div>';
}

function tick(g) {
  const el = document.querySelector("#tm");
  if (!el) return;
  const r = remainingSec(g);
  el.textContent = r == null ? "" : r + " 秒";
}

watchGame(render, tick);
</script>
</body>
</html>
